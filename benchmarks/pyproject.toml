[project]
name = "claude-code-multi-model-benchmarks"
version = "0.1.0"
description = "SWE benchmark harness: drive a coding assistant through dataset tasks non-interactively and score the artifacts"
requires-python = ">=3.10"
dependencies = [
    # HTTP client used by the headless runner and replay scripts
    "requests>=2.32.0",
    # Parse the benchmark dataset YAML files
    "pyyaml>=6.0",
    # Typed, validated models for the dataset schema and run metrics
    "pydantic>=2.7.0",
    # Charts and numerics for the report / cost-quality visualizations
    "matplotlib>=3.7.0",
    "numpy>=1.26.0",
]

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "bandit>=1.7.0",
    "types-requests>=2.32.0",
    "types-pyyaml>=6.0",
]
# Only agent=strands and agent=strands-harness need this:
# scripts/strands_agent_runner.py drives the task with the Strands Agents SDK.
# Kept out of the default install so the other harnesses do not pull it in.
# Install with `uv sync --group strands`. The [openai] extra is the client for
# OpenAI-compatible endpoints (vLLM, LiteLLM). Floor at 1.57: the vended
# shell/file_editor tools the runner uses are not in older releases.
# strands-harness is the Strands team's create_harness() for
# agent=strands-harness; capped below 0.2 because it is pre-1.0 and its
# defaults decide what that agent measures.
strands = [
    "strands-agents[openai]>=1.57.1,<2",
    "strands-harness>=0.1.2,<0.2",
]

# These scripts drive an external coding assistant (Claude Code) and score its
# artifacts; they do not import the model runtimes. Install them in their own
# venv with `uv sync` and run with `uv run` from this directory.
